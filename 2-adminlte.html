<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3X-UI · AdminLTE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
<style>
  body { background:#f4f6f9; }
  .content-wrapper { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  .card-header { background:#343a40; color:#fff; }
  .todo-note { font-size:.8rem; color:#dc3545; background:#fff3f3; border:1px dashed #dc3545; padding:.4rem .6rem; border-radius:.25rem; margin-top:.4rem; }
</style>
</head>
<body>
<div class="content-wrapper" id="app"></div>
<script src="render-core.js"></script>
<script>
const adapter = {
  themeName: "adminlte",
  header(schema) {
    return `
      <div class="mb-4 text-center">
        <h1 class="mb-1">${schema.title}</h1>
        <p class="text-muted">${schema.intro}</p>
      </div>`;
  },
  sectionStart(section) {
    return `
      <div class="card card-outline card-primary mb-4 shadow-sm">
        <div class="card-header"><h5 class="m-0">${section.icon} ${section.title}</h5></div>
        <div class="card-body" data-fields></div>
      </div>`;
  },
  radio(f) {
    return `<div class="form-group mb-3">
      <label class="fw-bold">${f.label}${f.required ? " *" : ""}</label>
      ${f.options.map(o => `
        <div class="form-check">
          <input class="form-check-input" type="radio" name="${f.id}" value="${o}" ${f.required ? "required" : ""}>
          <label class="form-check-label">${o}</label>
        </div>`).join("")}
    </div>`;
  },
  checkbox(f) {
    return `<div class="form-group mb-3">
      <label class="fw-bold">${f.label}${f.required ? " *" : ""}</label>
      ${f.options.map(o => `
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="${f.id}" value="${o}">
          <label class="form-check-label">${o}</label>
        </div>`).join("")}
    </div>`;
  },
  text(f) {
    return `<div class="form-group mb-3">
      <label class="fw-bold">${f.label}${f.required ? " *" : ""}</label>
      <input type="text" class="form-control" name="${f.id}" placeholder="${f.placeholder || ""}" ${f.required ? "required" : ""}>
    </div>`;
  },
  number(f) {
    return `<div class="form-group mb-3">
      <label class="fw-bold">${f.label}${f.required ? " *" : ""}</label>
      <input type="number" class="form-control" name="${f.id}" placeholder="${f.placeholder || ""}" ${f.required ? "required" : ""}>
    </div>`;
  },
  textarea(f) {
    return `<div class="form-group mb-3">
      <label class="fw-bold">${f.label}${f.required ? " *" : ""}</label>
      <textarea class="form-control" rows="3" name="${f.id}" placeholder="${f.placeholder || ""}" ${f.required ? "required" : ""}></textarea>
    </div>`;
  },
  file(f) {
    return `<div class="form-group mb-3">
      <label class="fw-bold">${f.label}${f.required ? " *" : ""}</label>
      <input type="file" class="form-control" name="${f.id}">
      <div class="todo-note">⚠ ${f.note}</div>
    </div>`;
  },
  submitButton() {
    return `<button type="submit" class="btn btn-primary btn-block w-100">Подтвердить</button>
      <p id="status" class="text-center mt-3 fw-bold"></p>`;
  }
};
renderForm("app", adapter);
</script>
</body>
</html>
