<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3X-UI · Argon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  :root { --grad: linear-gradient(87deg,#5e72e4,#825ee4); }
  body { background:#f8f9fe; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hero { background: var(--grad); padding: 3rem 1rem 6rem; color:#fff; text-align:center; }
  .hero h1 { font-weight:700; }
  .hero p { opacity:.85; max-width: 560px; margin: 0 auto; }
  .wrap { max-width: 720px; margin: -4rem auto 4rem; padding: 0 1rem; }
  .section { background:#fff; border-radius: 1rem; box-shadow: 0 1px 20px rgba(0,0,0,.08); padding: 1.75rem; margin-bottom: 1.25rem; }
  .section h3 { font-size: .8rem; text-transform: uppercase; letter-spacing:.05em; color:#5e72e4; font-weight:700; margin-bottom:1.25rem; }
  .field { margin-bottom: 1.1rem; }
  .field label.title { display:block; font-size:.8rem; font-weight:600; color:#525f7f; margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.02em; }
  .form-control { border-radius:.5rem; border:1px solid #cad1d7; font-size:.9rem; }
  .opt { display:inline-flex; align-items:center; gap:.35rem; margin:.2rem .8rem .2rem 0; font-size:.9rem; color:#525f7f; }
  button[type=submit] { background: var(--grad); border:none; color:#fff; font-weight:600; border-radius:.5rem; padding:.75rem; width:100%; }
  .todo-note { font-size:.75rem; color:#f5365c; margin-top:.35rem; }
  #status { text-align:center; margin-top:1rem; font-weight:600; color:#5e72e4; }
</style>
</head>
<body>
<div class="hero">
  <h1 id="hero-title"></h1>
  <p id="hero-intro"></p>
</div>
<div class="wrap" id="app"></div>
<script src="render-core.js"></script>
<script>
const adapter = {
  themeName: "argon",
  header(schema) {
    document.getElementById("hero-title").textContent = schema.title;
    document.getElementById("hero-intro").textContent = schema.intro;
    return "";
  },
  sectionStart(section) {
    return `<div class="section"><h3>${section.icon} ${section.title}</h3><div data-fields></div></div>`;
  },
  radio(f) {
    return `<div class="field"><label class="title">${f.label}${f.required ? " *" : ""}</label>
      ${f.options.map(o => `<label class="opt"><input type="radio" name="${f.id}" value="${o}" ${f.required ? "required" : ""}> ${o}</label>`).join("")}</div>`;
  },
  checkbox(f) {
    return `<div class="field"><label class="title">${f.label}${f.required ? " *" : ""}</label>
      ${f.options.map(o => `<label class="opt"><input type="checkbox" name="${f.id}" value="${o}"> ${o}</label>`).join("")}</div>`;
  },
  text(f) {
    return `<div class="field"><label class="title">${f.label}${f.required ? " *" : ""}</label>
      <input type="text" class="form-control" name="${f.id}" placeholder="${f.placeholder || ""}" ${f.required ? "required" : ""}></div>`;
  },
  number(f) {
    return `<div class="field"><label class="title">${f.label}${f.required ? " *" : ""}</label>
      <input type="number" class="form-control" name="${f.id}" placeholder="${f.placeholder || ""}" ${f.required ? "required" : ""}></div>`;
  },
  textarea(f) {
    return `<div class="field"><label class="title">${f.label}${f.required ? " *" : ""}</label>
      <textarea class="form-control" rows="3" name="${f.id}" placeholder="${f.placeholder || ""}" ${f.required ? "required" : ""}></textarea></div>`;
  },
  file(f) {
    return `<div class="field"><label class="title">${f.label}${f.required ? " *" : ""}</label>
      <input type="file" class="form-control" name="${f.id}">
      <div class="todo-note">⚠ ${f.note}</div></div>`;
  },
  submitButton() {
    return `<button type="submit">Подтвердить</button><p id="status"></p>`;
  }
};
renderForm("app", adapter);
</script>
</body>
</html>
