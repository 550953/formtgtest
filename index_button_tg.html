<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Связь с ботом</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #ffffff;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 15px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: #0088cc;
            color: #ffffff;
            padding: 12px 32px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #006699;
        }
        .info {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
        .info a {
            color: #0088cc;
            text-decoration: none;
        }
        .info a:hover {
            text-decoration: underline;
        }
        .divider {
            border: none;
            border-top: 1px solid #e8e8e8;
            margin: 25px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Связь с администратором</h1>
        <p class="subtitle">Напишите в Telegram-бот. Ответим в ближайшее время.</p>

        <a href="https://t.me/RedAlgorithmBot" target="_blank" class="btn">
            Написать в Telegram
        </a>

        <hr class="divider">

        <div class="info">
            <a href="https://t.me/RedAlgorithmBot" target="_blank">t.me/RedAlgorithmBot</a>
        </div>
    </div>

</body>
</html>
